# Secrets compartilhados por todas as tasks.
# Cada item deve corresponder a uma chave do JSON no secret global.
global: [PORTAL_PASSWORD, NST_REDIS_URL, RECAPTCHA_SITE_KEY, TICKET_SECRET]

# Secrets exclusivos de cada task.
# Os nomes das tasks devem corresponder às chaves de container_definitions.
tasks:
  client-api: [API_KEY, DATA_TEAM_TOKEN, RECAPTCHA_API_KEY]
  client-worker: [WORKER_TOKEN, QUEUE_SECRET]